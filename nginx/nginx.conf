server {
    listen ${NGINX_PORT};
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /api/ {
        # SERVER_URL은 경로 없이 host:port까지만 지정한다. 끝에 슬래시가 붙으면
        # nginx가 /api 접두사를 떼어내 server의 context-path와 어긋난다.
        proxy_pass ${SERVER_URL};

        # ingress의 proxy-body-size와 맞춘다. 기본값 1m으로는 에디터 본문이 막힐 수 있다.
        client_max_body_size 10m;

        # 백엔드 요청을 HTTP/1.1로 보낸다. 커넥션 재사용까지 하려면
        # upstream 블록의 keepalive가 필요하다(별도 작업 예정).
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
