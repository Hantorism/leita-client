upstream leita_server {
    server ${SERVER_UPSTREAM};

    # worker당 유지할 유휴 커넥션 수. 활성 커넥션 수는 제한 없이 늘어남.
    keepalive 32;
    # 커넥션 하나가 처리할 최대 요청 수. 초과하면 닫고 새로운 커넥션을 맺음. 기본값은 1000
    keepalive_requests 1000;
    # nginx와 server 사이의 유휴 커넥션을 살려둘 시간. 기본값은 60s
    keepalive_timeout 60s;
}

server {
    listen ${NGINX_PORT};
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /api/ {
        proxy_pass http://leita_server;

        client_max_body_size 10m;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
